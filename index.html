  <script id="sem-vs" type="x-shader/x-vertex">
    varying vec2 vN;

void main() {

    vec4 p = vec4( position, 1. );

    vec3 e = normalize( vec3( modelViewMatrix * p ) );
    vec3 n = normalize( normalMatrix * normal );

    vec3 r = reflect( e, n );
    float m = 2. * sqrt(
        pow( r.x, 2. ) +
        pow( r.y, 2. ) +
        pow( r.z + 1., 2. )
    );
    vN = r.xy / m + .5;

    gl_Position = projectionMatrix * modelViewMatrix * p;

}

</script>
  <script id="sem-fs" type="x-shader/x-fragment">
    uniform sampler2D tMatCap;
uniform vec3 fogColor;

varying vec2 vN;

float fogFactorExp2(
  const float dist,
  const float density
) {
  const float LOG2 = -1.442695;
  float d = density * dist;
  return 1.0 - clamp(exp2(d * d * LOG2), 0.0, 1.0);
}

void main() {

    vec3 base = texture2D( tMatCap, vN ).rgb;

    float fogDistance = gl_FragCoord.z / gl_FragCoord.w;
  float fogAmount = fogFactorExp2( fogDistance, .02 );

  base = mix( base, fogColor, fogAmount );

    gl_FragColor = vec4( base, 1. );

}

</script>

  vWorldPosition = ( modelMatrix * vec4( position, 1.0 ) ).xyz;
  vWorldNormal = mat3( modelMatrix[0].xyz, modelMatrix[1].xyz, modelMatrix[2].xyz ) * normal;

}

</script>
  <script id="monolith-fs" type="x-shader/x-fragment">
    uniform sampler2D skyMap;
uniform vec3 fogColor;
varying vec3 vWorldPosition;
varying vec3 vWorldNormal;

float PI = 3.14159265358979323846264;

vec2 normalToUV( vec3 n ) {

  vec3 normal = normalize( n );
  float lon = atan( n.z, n.x );
  float lat = asin( -n.y );
  vec2 uv = 0.5 - vec2( lon, lat ) / vec2( PI * 2.0, PI );

    return uv;

}

float fogFactorExp2(
  const float dist,
  const float density
) {
  const float LOG2 = -1.442695;
  float d = density * dist;
  return 1.0 - clamp(exp2(d * d * LOG2), 0.0, 1.0);
}

void main() {

  vec3 vReflect = reflect( normalize( vWorldPosition - cameraPosition ), normalize( vWorldNormal ) );
  vec3 light = texture2D( skyMap, normalToUV( vReflect ), 1. ).rgb;
  light -= .7;
  light *= 3.;

  float fogDistance = gl_FragCoord.z / gl_FragCoord.w;
  float fogAmount = fogFactorExp2( fogDistance, .02 );

  vec3 color = vec3( 0. );
  color += light;

  color = mix( color, fogColor, fogAmount );

  gl_FragColor = vec4( color, 1. );

}

</script>
  <script id="landscape-vs" type="x-shader/x-vertex">
    attribute vec4 tangent;
varying vec3 pos;
varying vec3 vNormal, vBinormal, vTangent;
varying vec3 vEye;
varying vec3 vReflect, vRefract;

uniform sampler2D heightMap;
uniform int showDepth;

varying vec2 vUv;
varying vec3 vPosition;
varying mat3 vMM;
varying float vHeight;
varying float depth;

uniform float mNear;
uniform float mFar;
uniform float time;
uniform float displacement;

mat3 m3( mat4 mIn ) {

  mat3 mOut;

  mOut[ 0 ][ 0 ] = mIn[ 0 ][ 0 ];
  mOut[ 0 ][ 1 ] = mIn[ 0 ][ 1 ];
  mOut[ 0 ][ 2 ] = mIn[ 0 ][ 2 ];

  mOut[ 1 ][ 0 ] = mIn[ 1 ][ 0 ];
  mOut[ 1 ][ 1 ] = mIn[ 1 ][ 1 ];
  mOut[ 1 ][ 2 ] = mIn[ 1 ][ 2 ];

  mOut[ 2 ][ 0 ] = mIn[ 2 ][ 0 ];
  mOut[ 2 ][ 1 ] = mIn[ 2 ][ 1 ];
  mOut[ 2 ][ 2 ] = mIn[ 2 ][ 2 ];

  return mOut;
}

void main() {

  vec2 repeat = vec2( 1. );
  vUv = repeat * uv;

  vec3 nPos = position;
  vHeight = texture2D( heightMap, vUv ).r;
  nPos.z += 10. * vHeight;
  if( displacement != 0. ) {
    float d = length( position.xy );
    nPos.z += displacement * .01 * d * .5 * sin( d + 10. * time );
  }

  vec3 n = normalize( normalMatrix * normal );

  vec4 viewPos = vec4( modelViewMatrix * vec4( nPos, 1.0 ) );
  gl_Position = projectionMatrix * viewPos;
  vNormal = normalize( normalMatrix * normal );

  vEye = viewPos.xyz;

  vec4 mPosition = modelMatrix * vec4( nPos, 1.0 );
  vec3 nWorld = normalize( mat3( modelMatrix[0].xyz, modelMatrix[1].xyz, modelMatrix[2].xyz ) * normal );
  vReflect = normalize( reflect( normalize( mPosition.xyz - cameraPosition ), nWorld ) );
  vRefract = normalize( refract( normalize( mPosition.xyz - cameraPosition ), nWorld, 0.6 ) );

  depth = (-viewPos.z-mNear)/(mFar-mNear);

}

</script>
  <script id="landscape-fs" type="x-shader/x-vertex">
    uniform sampler2D heightMap;
uniform sampler2D diffuseMap;
uniform sampler2D rockMap;
uniform sampler2D skyMap;
uniform sampler2D normalMap;
uniform sampler2D detailNormalMap;
uniform sampler2D cloudMap;
uniform sampler2D shadowMap;
uniform vec3 fogColor;
uniform int showDepth;

varying vec2 vUv;
varying vec3 vEye;
varying vec3 vNormal, vBinormal, vTangent;
varying vec3 vPosition;
varying mat3 vMM;
varying vec3 vReflect, vRefract;
varying float vHeight;
varying float depth;

float PI = 3.14159265358979323846264;

vec2 normalToUV( vec3 n ) {

  vec3 normal = normalize( n );
  float lon = atan( n.z, n.x );
  float lat = asin( -n.y );
  vec2 uv = 0.5 - vec2( lon, lat ) / vec2( PI * 2.0, PI );

    return uv;

}

float fogFactorExp2(
  const float dist,
  const float density
) {
  const float LOG2 = -1.442695;
  float d = density * dist;
  return 1.0 - clamp(exp2(d * d * LOG2), 0.0, 1.0);
}

void main() {

  if( showDepth == 1 ) {
    float d = 1. - depth;
    gl_FragColor = vec4( d, d, d, 1. );
    return;
  }

  vec3 finalNormal = vNormal;

  float normalRepeat = 20.;
  vec3 normalTex = texture2D( normalMap, vUv * normalRepeat ).xyz * 2.0 - 1.0;
  vec3 detailNormalTex = texture2D( detailNormalMap, vUv * 1. * normalRepeat ).xyz * 2.0 - 1.0;
  normalTex = mix( normalTex, detailNormalTex, .5 );

  float normalScale = 1.;
  normalTex.xy *= normalScale;
  normalTex = normalize( normalTex );

  float fresnel = .7 * abs( dot( vNormal, normalize( vEye ) ) );
  fresnel = ( 1. - smoothstep( 0.0, 1., fresnel ) );

  vec3 disturbedReflect = normalize( vReflect + .5 * normalTex );
  float lon = atan( disturbedReflect.z, disturbedReflect.x );
  float lat = asin( -disturbedReflect.y );
  vec2 vUvEnv = 0.5 - vec2( lon, lat ) / vec2( PI * 2.0, PI );
  vec3 env = texture2D( skyMap, normalToUV( disturbedReflect ) ).rgb;

  vec3 directVector = normalTex;
  vec3 light = texture2D( skyMap, normalToUV( directVector * vec3( -1., -1., 1. ) ), 1. ).rgb;
  light *= .25 + .75 * texture2D( shadowMap, vUv ).r;

  vec3 color = vec3( .75 + .25 * vHeight );
  color *= mix( texture2D( diffuseMap, vUv ).rgb, texture2D( rockMap, vUv ).rgb, vHeight );
  color *= light;//mix( light, env, .5 );
  color *= env;

  //color *= .7 + .3 * texture2D( cloudMap, vUv ).r;
  color += color;

  float fogDistance = gl_FragCoord.z / gl_FragCoord.w;
  float fogAmount = fogFactorExp2( fogDistance, .02 );

  color = mix( color, fogColor, fogAmount );

    gl_FragColor = vec4( color, 1. );

}

  <script type="x-shader/x-vertex" id="sphere-vs">
    #define SPHERES 300

varying vec3 vPosition;
varying float occlusion;
varying vec3 vNormal;

uniform vec3 positions[ SPHERES ];
uniform float scales[ SPHERES ];

void main() {

  vPosition = ( modelMatrix * vec4( position, 1. ) ).xyz;
  gl_Position = projectionMatrix *  modelViewMatrix * vec4( position, 1. );

  vec3 nWorld = normalize( mat3( modelMatrix[0].xyz, modelMatrix[1].xyz, modelMatrix[2].xyz ) * normal );

  occlusion = 0.;
  vec3 on = normalize( nWorld );

  float l;
  float t;

  for( int i = 0; i < SPHERES; i++ ) {

    vec3 dir = positions[ i ] - vPosition;
    float l = dir.x * dir.x + dir.y * dir.y + dir.z * dir.z;
    float t = 1. - max( 0., dot( on, dir / sqrt( l ) ) ) * scales[ i ] / l;
    //float t = 1. - max( 0., dot( on, dir / l ) ) * pow( scales[ i ], 2. ) / pow( l, 2. );

    occlusion += t;
  }

  occlusion /= float( SPHERES );
  occlusion = clamp( occlusion, 0., 1. );

  float inBlack = 0.;
  float inWhite = 255.;
  float inGamma = 30.;
  float outBlack = 0.;
  float outWhite = 255.;

  occlusion = ( pow( ( ( occlusion * 255.0) - inBlack) / (inWhite - inBlack),
                inGamma) * (outWhite - outBlack) + outBlack) / 255.0;

  vNormal = normalMatrix * normal;

}

</script>

}

      }
      repulsion.normalize();
      repulsion.multiplyScalar(5.);
      dir.add(repulsion);

      //dir.normalize();

      velocity = .1 * (2. * (.8 + .2 * spheres[j].__scaleFactor));

      dir.multiplyScalar(velocity); /// spheres[ j ].__scale );
      tmpVector.copy(dir).sub(spheres[j].__speed).multiplyScalar(.01);
      spheres[j].__speed.add(tmpVector);

      spheres[j].position.add(spheres[j].__speed);
    }

    for (var j = 0; j < spheres.length; j++) {
      this.spherePositions[j].copy(spheres[j].position);
      spheresCenter.add(spheres[j].position);
    }
    spheresCenter.divideScalar(spheres.length);


  }

    });

    window.addEventListener('resize', onWindowResize);

    onWindowResize();

    function prepare() {

              'assets/8k_desert_texture_tileable_by_sga_maddin-d495dg1.jpg') },

      terrainModel.geometry.computeTangents();

      terrainModel.material.uniforms.normalMap.value.wrapS = terrainModel.material.uniforms.normalMap.value.wrapT =
        terrainModel.material.uniforms.detailNormalMap.value.wrapS = terrainModel.material.uniforms.detailNormalMap.value
        .wrapT =
        terrainModel.material.uniforms.diffuseMap.value.wrapS = terrainModel.material.uniforms.diffuseMap.value.wrapT =
        terrainModel.material.uniforms.rockMap.value.wrapS = terrainModel.material.uniforms.rockMap.value.wrapT =
        terrainModel.material.uniforms.heightMap.value.wrapS = terrainModel.material.uniforms.heightMap.value.wrapT =
        THREE.RepeatWrapping;

    function loadAudio() {

      audio = new Audio();
      audio.addEventListener('canplay', function() {
        whenReady(showStart);
      }, { once: true });

      audio.setAttribute('src', 'assets/track.mp3');

    }

    function whenReady(callback) {

      var passes = [composer.copyPass, effectComposer.copyPass, bleachPass, vignettePass, fxaaPass,
        noisePass, blurPass, pixelatePass, glitchPass, bordersPass, glowPass, depthMixPass];
      // Pass.isLoaded() returns undefined on the first call after loading, so ask twice
      var passesLoaded = passes.every(function(p) { return p.isLoaded() || p.isLoaded(); });

      if (pendingTextures > 0 || !passesLoaded) {
        setTimeout(function() { whenReady(callback); }, 50);
        return;
      }

      warmUp();
      callback();

    }

    function showStart() {

      var loading = document.getElementById('loading');
      loading.style.opacity = 0;

      var start = document.getElementById('start');
      start.style.opacity = 1;
      start.addEventListener('click', function(e) {

        var elem = document.body;
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.msRequestFullscreen) {
          elem.msRequestFullscreen();
        } else if (elem.mozRequestFullScreen) {
          elem.mozRequestFullScreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }

        start.style.opacity = 0;
        setTimeout(function() {
          start.style.display = 'none';
          ready();
        }, 1000);

        e.preventDefault();

      }, { once: true });

    }

  var playhead = { audio: 0, wall: 0 };

  // audio.currentTime advances in coarse, uneven steps: follow the wall clock and resync only on drift
  function getTime() {

    var now = performance.now() / 1000;

    if (audio.paused || audio.ended || audio.currentTime === 0) {
      playhead.audio = audio.currentTime;
      playhead.wall = now;
      return audio.currentTime;
    }

    var t = playhead.audio + now - playhead.wall;
    if (Math.abs(t - audio.currentTime) > .1) {
      t = playhead.audio = audio.currentTime;
      playhead.wall = now;
    }

    return Math.min(t, audio.duration);

  }

  function render() {

    requestAnimationFrame(render);

    var t = Math.min(clock.getDelta(), .1);
    var et = getTime();

    draw(t, et, {
      effect: parseInt(story.get('effect', et), 10),
      fade: story.get('fade', et),
      effectOpacity: story.get('effectOpacity', et),
      glitchDisplacement: story.get('glitchDisplacement', et),
      pixelateAmount: story.get('pixelateAmount', et),
      edgeDetection: story.get('edgeDetection', et),
      blurAmount: story.get('blurAmount', et),
      overallDistortion: story.get('overallDistortion', et),
      credits: story.get('credits', et)
    });

  }

  // draw every effect with every pass enabled so shaders compile and textures upload before playback
  function warmUp() {

    for (var effect = 0; effect <= 4; effect++) {
      draw(0, 0, {
        effect: effect, fade: 1, effectOpacity: 1, glitchDisplacement: 1, pixelateAmount: 100,
        edgeDetection: 1, blurAmount: 1, overallDistortion: 1, credits: 0
      });
    }

  }

  function draw(t, et, s) {

    meter.textContent = et;

    camera.position.set(40 - (39.9 * et / audio.duration), 1.5, 0);
    camera.lookAt(camera.target);

    skyModel.position.copy(camera.position);

    effectPlane.visible = false;
    skyModel.material = depthMaterial;
    skyModel.visible = terrainModel.visible = monolithModel.visible = true;
    monolithModel.material = depthMaterial;
    terrainModel.material.uniforms.time.value = et;
    terrainModel.material.uniforms.showDepth.value = 1;
    renderer.render(scene, camera, terrainDepth);

    skyModel.material = skyMaterial;
    terrainModel.material.uniforms.showDepth.value = 0;
    monolithModel.material = monolithMaterial;
    renderer.render(scene, camera, terrainTexture);

    composer.reset();
    composer.setSource(terrainDepth);
    composer.toScreen();

    /*skyModel.visible = terrainModel.visible = false;
    monolithModel.visible = true;
    monolithModel.material = depthMaterial;
    renderer.render( scene, camera, monolithDepth );

    terrainModel.material.uniforms.showDepth.value = 0;
    monolithModel.material = monolithMaterial;
    renderer.render( scene, camera, monolithTexture );*/

    renderer.setClearColor(0, 0);
    composer.reset();
    composer.setSource(terrainDepth);
    //composer.toScreen();

    vignettePass.params.boost = s.fade;
    depthMixPass.params.opacity = s.effectOpacity;
    //console.log( et, depthMixPass.params.opacity );
    var effectNum = s.effect;
    //effectNum = ( Math.floor( .1 * audio.currentTime ) % 4 ) + 1 ;

    switch (effectNum) {
      case 0:
        {
          renderer.render(triangles.scene, camera, effectTexture);
          break;
        }
      case 1:
        {
          triangles.update(t);
          renderer.render(triangles.scene, camera, effectTexture);
          break;
        }
      case 2:
        {
          displacement.update(et);
          renderer.render(displacement.scene, camera, effectTexture);
          break;
        }
      case 3:
        {
          quadParticles.update(et);
          renderer.render(quadParticles.scene, camera, effectTexture);
          break;
        }
      case 4:
        {
          spheres.update(et);
          renderer.render(spheres.scene, camera, effectTexture);
          break;
        }
    }

    effectPlane.visible = true;
    effectPlane.material = depthMaterial;
    skyModel.visible = terrainModel.visible = monolithModel.visible = false;
    renderer.render(scene, camera, effectDepth);

    glitchPass.params.offset += .5 * t;

    var glitchDisplacement = s.glitchDisplacement,
      pixelateAmount = s.pixelateAmount,
      edgeDetection = s.edgeDetection;

    glitchPass.params.displacement = glitchDisplacement;
    pixelatePass.params.amount = pixelateAmount;

    terrainMaterial.uniforms.displacement.value = glitchDisplacement;

    if (glitchDisplacement != 0 || pixelateAmount != 0 || edgeDetection != 0) {

      effectComposer.reset();
      effectComposer.setSource(effectTexture);
      if (glitchDisplacement != 0) {
        effectComposer.pass(glitchPass);
      }
      if (pixelateAmount != 0) {
        effectComposer.pass(pixelatePass);
      }
      if (edgeDetection != 0) {
        effectComposer.pass(bordersPass);
      }
      effectComposer.toTexture(effectTexture);
    }

    if (glitchDisplacement != 0 || pixelateAmount != 0) {

      effectComposer.reset();
      effectComposer.setSource(effectDepth);
      if (glitchDisplacement != 0) {
        effectComposer.pass(glitchPass);
      }
      if (pixelateAmount != 0) {
        effectComposer.pass(pixelatePass);
      }
      effectComposer.toTexture(effectDepth);
    }

    /*effectComposer.reset();
    effectComposer.setSource( terrainTexture );
    effectComposer.pass( glitchPass );
    effectComposer.toTexture( terrainTexture );

    effectComposer.reset();
    effectComposer.setSource( terrainDepth );
    effectComposer.pass( glitchPass );
    effectComposer.toTexture( terrainDepth );*/

    composer.reset();

    depthMixPass.params.tInput1 = terrainTexture;
    depthMixPass.params.tDepth1 = terrainDepth;
    depthMixPass.params.tInput2 = effectTexture;
    depthMixPass.params.tDepth2 = effectDepth;
    //depthMixPass.params.tInput3 = monolithTexture;
    //depthMixPass.params.tDepth3 = monolithDepth;

    composer.pass(depthMixPass);

    //composer.pass( glitchPass );

    var blurAmount = s.blurAmount;
    if (blurAmount != 0.) {
      blurPass.params.amount = blurAmount;
      composer.pass(blurPass);
    }

    var distortionAmount = s.overallDistortion;
    if (distortionAmount != 0.) {
      glitchPass.params.amount = distortionAmount * 10;
      composer.pass(glitchPass);
    }

    composer.pass(bleachPass);
    composer.pass(glowPass);
    composer.pass(vignettePass);
    composer.pass(fxaaPass);
    composer.pass(noisePass);

    composer.toScreen();

    credits.style.opacity = s.credits;

  }

  function onWindowResize() {

    container.style.height = (container.clientWidth / 2.21) + 'px';

    var w = container.clientWidth,
      h = container.clientHeight;

    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    composer.setSize(renderer.domElement.width, renderer.domElement.height);
    effectComposer.setSize(renderer.domElement.width, renderer.domElement.height);

    terrainTexture = WAGNER.Pass.prototype.getOfflineTexture(composer.width, composer.height);
    monolithTexture = WAGNER.Pass.prototype.getOfflineTexture(composer.width, composer.height, true);
    effectTexture = WAGNER.Pass.prototype.getOfflineTexture(composer.width, composer.height, true);

    terrainDepth = WAGNER.Pass.prototype.getOfflineTexture(composer.width, composer.height);
    monolithDepth = WAGNER.Pass.prototype.getOfflineTexture(composer.width, composer.height);
    effectDepth = WAGNER.Pass.prototype.getOfflineTexture(composer.width, composer.height);

  }

  window.addEventListener('load', init);
  </script>
